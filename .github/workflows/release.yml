name: Release

# Publish a release on GitHub (Releases > Draft a new release, with a tag like v0.2.0)
# and this builds the Windows .exe and attaches it to that release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test
      - name: Build release .exe
        run: cargo build --release
      - name: Attach .exe to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="agent-cleanup-${GITHUB_REF_NAME}-windows-x64.exe"
          cp target/release/agent-cleanup.exe "$name"
          gh release upload "$GITHUB_REF_NAME" "$name" --clobber
