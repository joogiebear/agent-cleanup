name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build release .exe
        run: cargo build --release
      - name: Report .exe size
        shell: bash
        run: |
          bytes=$(stat -c %s target/release/agent-cleanup.exe)
          echo "agent-cleanup.exe is $bytes bytes ($((bytes / 1048576)) MB)"
          echo "### agent-cleanup.exe: $((bytes / 1048576)) MB ($bytes bytes)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-cleanup-windows
          path: target/release/agent-cleanup.exe
