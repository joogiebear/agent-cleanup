[package]
name = "agent-cleanup"
version = "0.2.0"
edition = "2024"
description = "Finds and cleans up clutter left behind by AI coding agents: stray clones, stale repos and files outside your projects."

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
# glow (OpenGL) instead of the default wgpu backend keeps the .exe small.
eframe = { version = "0.37.0", default-features = false, features = [
    "glow",
    "default_fonts",
    "accesskit",
    "clipboard",
    "links",
    "wayland",
    "x11",
] }
egui_extras = "0.37.0"
rfd = "0.18.0"
self-replace = "1.5.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
trash = "5.3.0"
ureq = { version = "3.5.1", features = ["json", "platform-verifier"] }
walkdir = "2.5.0"

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
