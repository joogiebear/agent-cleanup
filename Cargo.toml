[package]
name = "agent-cleanup"
version = "0.16.1"
edition = "2024"
description = "Finds and cleans up clutter left behind by AI coding agents: stray clones, stale repos and files outside your projects."
license = "MIT"

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
# Zed's GPUI plus the gpui-component widget library, pinned exactly because
# GPUI is pre-1.0 and changes between releases.
gpui-kit = "=0.9.0"
self-replace = "1.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Already in the build through gpui; checks the update download.
sha2 = "0.10.9"
toml = "1.2.1"
trash = "5.3.0"
ureq = { version = "3.5.1", features = ["json", "platform-verifier"] }
walkdir = "2.5.0"

# The weekly check's notification.
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8.1"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
